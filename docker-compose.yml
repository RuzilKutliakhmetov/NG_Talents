services:

  postgres:
    image: postgres:17
    container_name: ng-talents-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ngtalents
      POSTGRES_USER: ngtalents
      POSTGRES_PASSWORD: ngtalents_dev_password

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ngtalents -d ngtalents"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: ng-talents-redis
    restart: unless-stopped

    command: redis-server --appendonly yes

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    container_name: ng-talents-minio
    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-ngtalents_minio}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-ngtalents_minio_password}

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  minio_data: