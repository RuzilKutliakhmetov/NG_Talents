services:

  postgres:
    image: postgres:17
    container_name: ng-talents-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ngtalents
      POSTGRES_USER: ngtalents
      POSTGRES_PASSWORD: ngtalents_dev_password

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ngtalents -d ngtalents"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: ng-talents-redis
    restart: unless-stopped

    command: redis-server --appendonly yes

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data: